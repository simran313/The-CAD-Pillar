<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The CAD Pillar</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
    <h1>Welcome to The CAD Pillar</h1>
    <script>
        window.netlifyIdentity = window.netlifyIdentity || {}; 
        window.netlifyIdentity.init();
        const urlHash = window.location.hash;
        if (urlHash.includes('recovery_token')) {
            window.netlifyIdentity.open('recovery');
        } else if (urlHash.includes('invite_token')) {
            window.netlifyIdentity.open('signup');
        }
    </script>
</body>
</html>
