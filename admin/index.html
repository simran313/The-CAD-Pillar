<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - The CAD Pillar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    .modal {
      display: none;
    }
    .modal.active {
      display: flex;
    }
  </style>
</head>
<body class="bg-gray-50">
  <!-- Login Screen -->
  <div id="loginScreen" class="min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-lg shadow-lg max-w-md w-full">
      <!-- Logo/Header -->
      <div class="text-center mb-6">
        <div class="w-16 h-16 bg-gradient-to-br from-blue-500 to-blue-600 rounded-xl mx-auto mb-4 flex items-center justify-center">
          <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
          </svg>
        </div>
        <h1 class="text-3xl font-bold text-gray-800 mb-2">Admin Dashboard</h1>
        <p class="text-gray-600">The CAD Pillar</p>
      </div>
      
      <!-- Google Login Button (Primary) -->
      <button id="loginButton" class="w-full bg-white border-2 border-gray-300 text-gray-700 py-3 px-6 rounded-lg hover:bg-gray-50 transition mb-4 flex items-center justify-center gap-3 font-medium">
        <svg class="w-5 h-5" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Sign in with Google
      </button>
      
      <!-- Divider -->
      <div class="relative my-4">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-gray-300"></div>
        </div>
        <div class="relative flex justify-center text-sm">
          <span class="px-2 bg-white text-gray-500">Authorized Access</span>
        </div>
      </div>
      
      <!-- Info -->
      <div class="bg-blue-50 border border-blue-200 rounded-lg p-3">
        <p class="text-xs text-blue-800 text-center">
          <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
          Only authorized email addresses can access this dashboard.
        </p>
      </div>
    </div>
  </div>

  <!-- Admin Dashboard -->
  <div id="dashboardScreen" class="hidden">
    <!-- Header -->
    <nav class="bg-white shadow-sm border-b border-gray-200">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-blue-600 rounded-lg flex items-center justify-center">
              <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
              </svg>
            </div>
            <div>
              <h1 class="text-xl font-bold text-gray-800">Admin Dashboard</h1>
              <span class="text-xs text-gray-500">The CAD Pillar</span>
            </div>
          </div>
          <div class="flex items-center space-x-4">
            <div class="flex items-center gap-2">
              <div id="userAvatar" class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center">
                <span id="userInitials" class="text-sm font-medium text-blue-600"></span>
              </div>
              <span id="userEmail" class="text-sm text-gray-600"></span>
            </div>
            <button id="logoutButton" class="text-sm text-red-600 hover:text-red-700 font-medium">
              Logout
            </button>
          </div>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <!-- Filters -->
      <div class="bg-white rounded-lg shadow p-6 mb-6">
        <div class="flex flex-wrap items-center gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Filter by Status</label>
            <select id="statusFilter" class="border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:border-transparent">
              <option value="all">All Statuses</option>
              <option value="pending">Pending</option>
              <option value="paid">Paid</option>
              <option value="completed">Completed</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </div>
          <div class="flex-1"></div>
          <button id="refreshButton" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition">
            Refresh
          </button>
        </div>
      </div>

      <!-- Loading State -->
      <div id="loadingState" class="text-center py-12">
        <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
        <p class="mt-4 text-gray-600">Loading quotes...</p>
      </div>

      <!-- Error State -->
      <div id="errorState" class="hidden bg-red-50 border border-red-200 rounded-lg p-6 mb-6">
        <h3 class="text-red-800 font-semibold mb-2">Error Loading Quotes</h3>
        <p id="errorMessage" class="text-red-600"></p>
      </div>

      <!-- Quotes Table -->
      <div id="quotesTable" class="hidden bg-white rounded-lg shadow overflow-hidden">
        <div class="overflow-x-auto">
          <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
              <tr>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Customer</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Design Type</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Price Range</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
              </tr>
            </thead>
            <tbody id="quotesTableBody" class="bg-white divide-y divide-gray-200">
              <!-- Rows will be inserted here -->
            </tbody>
          </table>
        </div>
        
        <!-- Pagination -->
        <div class="bg-gray-50 px-6 py-4 flex items-center justify-between border-t border-gray-200">
          <div class="text-sm text-gray-700">
            Showing <span id="showingCount">0</span> of <span id="totalCount">0</span> quotes
          </div>
          <div class="flex space-x-2">
            <button id="prevButton" class="px-4 py-2 border border-gray-300 rounded-lg text-sm hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
              Previous
            </button>
            <button id="nextButton" class="px-4 py-2 border border-gray-300 rounded-lg text-sm hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
              Next
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Quote Details Modal -->
  <div id="quoteModal" class="modal fixed inset-0 bg-black bg-opacity-50 items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-xl max-w-4xl w-full mx-4 max-h-[90vh] overflow-y-auto">
      <div class="sticky top-0 bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center">
        <h2 class="text-2xl font-bold text-gray-800">Quote Details</h2>
        <button id="closeModal" class="text-gray-500 hover:text-gray-700">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>
      
      <div id="quoteDetails" class="p-6">
        <!-- Details will be inserted here -->
      </div>
    </div>
  </div>

  <script>
    // Global state
    let currentUser = null;
    let currentToken = null;
    let quotes = [];
    let currentPage = 0;
    let pageSize = 50;
    let totalQuotes = 0;
    let currentStatus = 'all';

    // API base URL
    const API_BASE = '/.netlify/functions';

    // Initialize Netlify Identity
    netlifyIdentity.on('init', user => {
      if (user) {
        handleLogin(user);
      }
    });

    netlifyIdentity.on('login', user => {
      handleLogin(user);
      netlifyIdentity.close();
    });

    netlifyIdentity.on('logout', () => {
      handleLogout();
    });

    // Initialize the widget
    netlifyIdentity.init();

    // Auto-open widget if recovery_token or invite_token is present in URL hash
    if (window.location.hash) {
      const hash = window.location.hash;
      if (hash.includes('recovery_token=') || hash.includes('invite_token=') || hash.includes('confirmation_token=')) {
        netlifyIdentity.open();
      }
    }

    // Event listeners
    document.getElementById('loginButton').addEventListener('click', () => {
      netlifyIdentity.open('login');
    });

    document.getElementById('logoutButton').addEventListener('click', () => {
      netlifyIdentity.logout();
    });

    document.getElementById('refreshButton').addEventListener('click', () => {
      loadQuotes();
    });

    document.getElementById('statusFilter').addEventListener('change', (e) => {
      currentStatus = e.target.value;
      currentPage = 0;
      loadQuotes();
    });

    document.getElementById('prevButton').addEventListener('click', () => {
      if (currentPage > 0) {
        currentPage--;
        loadQuotes();
      }
    });

    document.getElementById('nextButton').addEventListener('click', () => {
      if ((currentPage + 1) * pageSize < totalQuotes) {
        currentPage++;
        loadQuotes();
      }
    });

    document.getElementById('closeModal').addEventListener('click', () => {
      document.getElementById('quoteModal').classList.remove('active');
    });

    // Handle login
    function handleLogin(user) {
      currentUser = user;
      currentToken = user.token.access_token;
      
      // Set user email
      document.getElementById('userEmail').textContent = user.email;
      
      // Set user initials (from email)
      const emailParts = user.email.split('@')[0];
      const initials = emailParts.substring(0, 2).toUpperCase();
      const initialsElement = document.getElementById('userInitials');
      if (initialsElement) {
        initialsElement.textContent = initials;
      }
      
      // Show dashboard
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('dashboardScreen').classList.remove('hidden');
      
      // Load quotes
      loadQuotes();
      
      // Log successful login (optional - for debugging)
      console.log('Admin logged in:', {
        email: user.email,
        provider: user.app_metadata?.provider || 'email',
        timestamp: new Date().toISOString(),
      });
    }

    // Handle logout
    function handleLogout() {
      currentUser = null;
      currentToken = null;
      document.getElementById('loginScreen').classList.remove('hidden');
      document.getElementById('dashboardScreen').classList.add('hidden');
    }

    // Load quotes from API
    async function loadQuotes() {
      document.getElementById('loadingState').classList.remove('hidden');
      document.getElementById('errorState').classList.add('hidden');
      document.getElementById('quotesTable').classList.add('hidden');

      try {
        const offset = currentPage * pageSize;
        const statusParam = currentStatus !== 'all' ? `&status=${currentStatus}` : '';
        
        const response = await fetch(
          `${API_BASE}/admin-list-quotes?limit=${pageSize}&offset=${offset}${statusParam}`,
          {
            headers: {
              'Authorization': `Bearer ${currentToken}`,
            },
          }
        );

        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.error || 'Failed to load quotes');
        }

        const data = await response.json();
        quotes = data.quotes;
        totalQuotes = data.pagination.total;

        renderQuotes();
        updatePagination();

        document.getElementById('loadingState').classList.add('hidden');
        document.getElementById('quotesTable').classList.remove('hidden');
      } catch (error) {
        console.error('Error loading quotes:', error);
        document.getElementById('loadingState').classList.add('hidden');
        document.getElementById('errorState').classList.remove('hidden');
        document.getElementById('errorMessage').textContent = error.message;
      }
    }

    // Render quotes table
    function renderQuotes() {
      const tbody = document.getElementById('quotesTableBody');
      tbody.innerHTML = '';

      if (quotes.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="px-6 py-8 text-center text-gray-500">
              No quotes found
            </td>
          </tr>
        `;
        return;
      }

      quotes.forEach(quote => {
        const row = document.createElement('tr');
        row.className = 'hover:bg-gray-50';
        row.innerHTML = `
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
            ${new Date(quote.created_at).toLocaleDateString()}
          </td>
          <td class="px-6 py-4 whitespace-nowrap">
            <div class="text-sm font-medium text-gray-900">${escapeHtml(quote.full_name)}</div>
            <div class="text-sm text-gray-500">${escapeHtml(quote.email)}</div>
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
            ${escapeHtml(quote.design_type)}
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
            $${quote.price_min} - $${quote.price_max}
          </td>
          <td class="px-6 py-4 whitespace-nowrap">
            <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${getStatusClass(quote.status)}">
              ${escapeHtml(quote.status)}
            </span>
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
            <button onclick="viewQuote('${quote.id}')" class="text-blue-600 hover:text-blue-900">
              View Details
            </button>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    // Update pagination
    function updatePagination() {
      const showing = Math.min((currentPage + 1) * pageSize, totalQuotes);
      document.getElementById('showingCount').textContent = showing;
      document.getElementById('totalCount').textContent = totalQuotes;
      
      document.getElementById('prevButton').disabled = currentPage === 0;
      document.getElementById('nextButton').disabled = showing >= totalQuotes;
    }

    // View quote details
    window.viewQuote = function(quoteId) {
      const quote = quotes.find(q => q.id === quoteId);
      if (!quote) return;

      const modal = document.getElementById('quoteModal');
      const details = document.getElementById('quoteDetails');

      details.innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <h3 class="text-lg font-semibold text-gray-800 mb-4">Customer Information</h3>
            <dl class="space-y-2">
              <div>
                <dt class="text-sm font-medium text-gray-500">Full Name</dt>
                <dd class="text-sm text-gray-900">${escapeHtml(quote.full_name)}</dd>
              </div>
              <div>
                <dt class="text-sm font-medium text-gray-500">Email</dt>
                <dd class="text-sm text-gray-900">${escapeHtml(quote.email)}</dd>
              </div>
              <div>
                <dt class="text-sm font-medium text-gray-500">Phone</dt>
                <dd class="text-sm text-gray-900">${escapeHtml(quote.phone)}</dd>
              </div>
            </dl>
          </div>

          <div>
            <h3 class="text-lg font-semibold text-gray-800 mb-4">Quote Details</h3>
            <dl class="space-y-2">
              <div>
                <dt class="text-sm font-medium text-gray-500">Design Type</dt>
                <dd class="text-sm text-gray-900">${escapeHtml(quote.design_type)}</dd>
              </div>
              <div>
                <dt class="text-sm font-medium text-gray-500">Stones</dt>
                <dd class="text-sm text-gray-900">${escapeHtml(quote.stones)}</dd>
              </div>
              <div>
                <dt class="text-sm font-medium text-gray-500">Metal</dt>
                <dd class="text-sm text-gray-900">${escapeHtml(quote.metal)}</dd>
              </div>
              <div>
                <dt class="text-sm font-medium text-gray-500">Delivery</dt>
                <dd class="text-sm text-gray-900">${escapeHtml(quote.delivery)}</dd>
              </div>
              <div>
                <dt class="text-sm font-medium text-gray-500">Add Render</dt>
                <dd class="text-sm text-gray-900">${quote.add_render ? 'Yes' : 'No'}${quote.render_tones ? ` (${quote.render_tones} tone${quote.render_tones > 1 ? 's' : ''})` : ''}</dd>
              </div>
            </dl>
          </div>

          <div>
            <h3 class="text-lg font-semibold text-gray-800 mb-4">Pricing</h3>
            <dl class="space-y-2">
              <div>
                <dt class="text-sm font-medium text-gray-500">Price Range</dt>
                <dd class="text-sm text-gray-900">$${quote.price_min} - $${quote.price_max}</dd>
              </div>
              <div>
                <dt class="text-sm font-medium text-gray-500">Deposit Amount</dt>
                <dd class="text-sm text-gray-900">$${quote.deposit_amount}</dd>
              </div>
              <div>
                <dt class="text-sm font-medium text-gray-500">Created At</dt>
                <dd class="text-sm text-gray-900">${new Date(quote.created_at).toLocaleString()}</dd>
              </div>
              ${quote.updated_at ? `
              <div>
                <dt class="text-sm font-medium text-gray-500">Updated At</dt>
                <dd class="text-sm text-gray-900">${new Date(quote.updated_at).toLocaleString()}</dd>
              </div>
              ` : ''}
            </dl>
          </div>

          <div>
            <h3 class="text-lg font-semibold text-gray-800 mb-4">Status & Notes</h3>
            <div class="mb-4">
              <label class="block text-sm font-medium text-gray-700 mb-2">Status</label>
              <select id="editStatus-${quote.id}" class="w-full border border-gray-300 rounded-lg px-3 py-2">
                <option value="pending" ${quote.status === 'pending' ? 'selected' : ''}>Pending</option>
                <option value="paid" ${quote.status === 'paid' ? 'selected' : ''}>Paid</option>
                <option value="completed" ${quote.status === 'completed' ? 'selected' : ''}>Completed</option>
                <option value="cancelled" ${quote.status === 'cancelled' ? 'selected' : ''}>Cancelled</option>
              </select>
            </div>
            <div class="mb-4">
              <label class="block text-sm font-medium text-gray-700 mb-2">Admin Notes</label>
              <textarea id="editNotes-${quote.id}" rows="4" class="w-full border border-gray-300 rounded-lg px-3 py-2"></textarea>
            </div>
            <div id="updateMessage-${quote.id}" class="mb-4 hidden"></div>
            <button onclick="updateQuote('${quote.id}')" class="w-full bg-blue-600 text-white py-2 px-4 rounded-lg hover:bg-blue-700 transition">
              Update Quote
            </button>
          </div>

          ${quote.image_path ? `
          <div class="md:col-span-2">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">Reference Image</h3>
            <button onclick="viewImage('${quote.id}')" class="bg-green-600 text-white py-2 px-4 rounded-lg hover:bg-green-700 transition">
              View / Download Image
            </button>
            <div id="imageMessage-${quote.id}" class="mt-4 hidden"></div>
            <div id="imagePreview-${quote.id}" class="mt-4 hidden">
              <img src="" alt="Reference Image" class="max-w-full rounded-lg shadow-lg" />
            </div>
            </div>
          </div>
          ` : ''}
        </div>
      `;

      modal.classList.add('active');
      
      // Set textarea value safely to avoid XSS
      const notesTextarea = document.getElementById(`editNotes-${quote.id}`);
      if (notesTextarea) {
        notesTextarea.value = quote.admin_notes || '';
      }
    };

    // Update quote
    window.updateQuote = async function(quoteId) {
      const status = document.getElementById(`editStatus-${quoteId}`).value;
      const adminNotes = document.getElementById(`editNotes-${quoteId}`).value;
      const messageDiv = document.getElementById(`updateMessage-${quoteId}`);

      try {
        // Show loading state
        messageDiv.className = 'mb-4 p-3 bg-blue-50 text-blue-700 rounded-lg';
        messageDiv.textContent = 'Updating quote...';
        messageDiv.classList.remove('hidden');

        const response = await fetch(`${API_BASE}/admin-update-quote`, {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${currentToken}`,
          },
          body: JSON.stringify({
            quoteId,
            status,
            adminNotes,
          }),
        });

        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.error || 'Failed to update quote');
        }

        // Show success message
        messageDiv.className = 'mb-4 p-3 bg-green-50 text-green-700 rounded-lg';
        messageDiv.textContent = '✓ Quote updated successfully!';
        
        // Refresh the list and close modal after a short delay
        setTimeout(() => {
          document.getElementById('quoteModal').classList.remove('active');
          loadQuotes();
        }, 1000);
      } catch (error) {
        console.error('Error updating quote:', error);
        // Show error message
        messageDiv.className = 'mb-4 p-3 bg-red-50 text-red-700 rounded-lg';
        messageDiv.textContent = '✗ Failed to update quote: ' + error.message;
        messageDiv.classList.remove('hidden');
      }
    };

    // View image
    window.viewImage = async function(quoteId) {
      const messageDiv = document.getElementById(`imageMessage-${quoteId}`);
      
      try {
        // Show loading state
        messageDiv.className = 'mt-4 p-3 bg-blue-50 text-blue-700 rounded-lg';
        messageDiv.textContent = 'Loading image...';
        messageDiv.classList.remove('hidden');

        const response = await fetch(`${API_BASE}/admin-signed-image-url`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${currentToken}`,
          },
          body: JSON.stringify({ quoteId }),
        });

        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.error || 'Failed to get image URL');
        }

        const data = await response.json();
        
        // Hide loading message
        messageDiv.classList.add('hidden');
        
        // Open image in new tab
        window.open(data.signedUrl, '_blank');
        
        // Also show in modal
        const preview = document.getElementById(`imagePreview-${quoteId}`);
        if (preview) {
          const img = preview.querySelector('img');
          img.src = data.signedUrl;
          preview.classList.remove('hidden');
        }
      } catch (error) {
        console.error('Error loading image:', error);
        // Show error message
        messageDiv.className = 'mt-4 p-3 bg-red-50 text-red-700 rounded-lg';
        messageDiv.textContent = '✗ Failed to load image: ' + error.message;
        messageDiv.classList.remove('hidden');
      }
    };

    // Utility functions
    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function getStatusClass(status) {
      const classes = {
        pending: 'bg-yellow-100 text-yellow-800',
        paid: 'bg-blue-100 text-blue-800',
        completed: 'bg-green-100 text-green-800',
        cancelled: 'bg-red-100 text-red-800',
      };
      return classes[status] || 'bg-gray-100 text-gray-800';
    }
    </script>

   <!-- Netlify Identity (required so #recovery_token / #invite_token links work) -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.init();

      const hash = window.location.hash || "";

      // Force correct screen from email links
      if (hash.includes("recovery_token=")) {
        window.netlifyIdentity.open("recovery");
      } else if (hash.includes("invite_token=") || hash.includes("confirmation_token=")) {
        window.netlifyIdentity.open("signup");
      }
    }
  </script>
</body>
</html>
